[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-pharmacology"
version = "0.1.0"
description = "GNN Natural Products Pharmacology Suite for FaCENA UNNE Beca Plan"
authors = [{name = "FaCENA UNNE", email = "beca.investigacion@facena.unne.edu.ar"}]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "scikit-learn>=1.2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pytest>=7.0.0"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
